<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sự Kiện | Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🎓 Cổng Thông Tin Sự Kiện</a>
        </div>
    </nav>

    <div class="container my-4">
        <h3 class="text-center text-dark mb-4 fw-bold">📅 Các Sự Kiện Đang Diễn Ra</h3>
        
        <div id="eventList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            </div>
    </div>

    <script>
        // AC 1: Gọi hàm fetch lấy dữ liệu từ Backend
        fetch('/api/events')
            .then(response => response.json())
            .then(events => {
                const listContainer = document.getElementById('eventList');
                
                if (!events || events.length === 0) {
                    listContainer.innerHTML = '<div class="col-12 text-center text-muted"><h5>Hiện tại chưa có sự kiện nào.</h5></div>';
                    return;
                }

                // AC 2: Dùng vòng lặp map() duyệt mảng và tạo thẻ Card
                const cardsHTML = events.map(event => `
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-body">
                                <h5 class="card-title fw-bold text-primary">${event.name}</h5>
                                <h6 class="card-subtitle mb-3 text-danger">
                                    ⏱ ${new Date(event.time).toLocaleString('vi-VN')}
                                </h6>
                                <p class="card-text mb-2"><strong>📍 Địa điểm:</strong> ${event.location}</p>
                                <p class="card-text text-secondary" style="font-size: 0.9rem;">
                                    ${event.description || 'Đang cập nhật chi tiết...'}
                                </p>
                            </div>
                            <div class="card-footer bg-white border-top-0 text-center pb-3">
                                <button class="btn btn-outline-primary fw-bold w-100">Đăng ký tham gia</button>
                            </div>
                        </div>
                    </div>
                `).join(''); 

                // AC 3: Đổ dữ liệu lên UI (đã tối ưu responsive nhờ class row-cols)
                listContainer.innerHTML = cardsHTML;
            })
            .catch(error => {
                console.error('Lỗi khi tải dữ liệu:', error);
                document.getElementById('eventList').innerHTML = '<div class="col-12 text-center text-danger"><p>Lỗi kết nối máy chủ.</p></div>';
            });
    </script>
</body>
</html>
