<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 100px; }
        .login-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .error { color: red; font-size: 0.9em; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Đăng nhập Admin</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Tài khoản:</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Đăng nhập</button>
        <div id="errorMsg" class="error"></div>
    </form>
</div>

<script>
    // Kiểm tra token khi vừa load trang login
    window.onload = async function() {
        const token = localStorage.getItem('admin_token');
        if (token) {
            const response = await fetch('http://localhost:3000/api/verify-token', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                // Nếu token còn hạn, tự động vào trang admin
                window.location.href = 'admin.html';
            } else {
                localStorage.removeItem('admin_token'); // Xóa token rác
            }
        }
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const response = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                // Lưu token vào localStorage 
                localStorage.setItem('admin_token', data.token);
                
                // mở comment và chạy thực tế redirect
                window.location.href = 'admin.html';
            } else {
                errorMsg.innerText = data.message;
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            errorMsg.innerText = "Lỗi kết nối Server!";
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
