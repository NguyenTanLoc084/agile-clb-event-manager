<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; }
        .form-container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 350px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;}
        button:hover { background-color: #218838; }
        .error-msg { color: red; font-size: 0.9em; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Đổi Mật Khẩu</h2>
        <div id="errorMessage" class="error-msg"></div>

        <form id="changePasswordForm">
            <div class="form-group">
                <label for="oldPassword">Mật khẩu cũ:</label>
                <input type="password" id="oldPassword" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới:</label>
                <input type="password" id="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit">Cập nhật mật khẩu</button>
        </form>
    </div>

    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Ngăn form reload lại trang

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.style.display = 'none';

            // Tiêu chí 4: Mật khẩu mới tối thiểu 6 ký tự
            if (newPassword.length < 6) {
                errorDiv.innerText = "Mật khẩu mới phải có tối thiểu 6 ký tự.";
                errorDiv.style.display = 'block';
                return;
            }

            // Tiêu chí 3: Mật khẩu mới và Xác nhận phải khớp nhau
            if (newPassword !== confirmPassword) {
                errorDiv.innerText = "Mật khẩu mới và Xác nhận mật khẩu không trùng khớp.";
                errorDiv.style.display = 'block';
                return;
            }

            try {
                // Gọi API
                const response = await fetch('http://127.0.0.1:5000/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const result = await response.json();

                if (!response.ok) {
                    // Tiêu chí 2: Xử lý lỗi từ Backend (Sai mật khẩu cũ)
                    errorDiv.innerText = result.error;
                    errorDiv.style.display = 'block';
                } else {
                    // Tiêu chí 5: Hiển thị thông báo thành công bằng SweetAlert2
                    Swal.fire({
                        icon: 'success',
                        title: 'Thành công!',
                        text: 'Đổi mật khẩu thành công.',
                        confirmButtonText: 'Đóng'
                    }).then(() => {
                        // Reset form sau khi thành công
                        document.getElementById('changePasswordForm').reset();
                    });
                }
            } catch (error) {
                errorDiv.innerText = "Không thể kết nối đến server.";
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
