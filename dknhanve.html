<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhận vé QR qua Gmail</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h2>Đăng ký nhận vé QR</h2>
    <input type="email" id="emailInput" placeholder="Nhập Gmail của bạn...">
    <button onclick="checkEmail()">Nhận vé</button>

    <script src="krbemail.js"></script>
</body>
<style>
    body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 100px; }
    input { 
        padding: 12px; 
        width: 280px; 
        border: 1px solid #ddd; 
        border-radius: 8px; 
        margin-bottom: 10px;
        transition: border 0.3s;
    }
    input:focus { border-color: #007bff; outline: none; }
    button { 
        padding: 12px 25px; 
        background: #007bff; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
    }
    button:hover { background: #0056b3; }
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="effect.js"></script>

<script>
    // Gọi thử luôn để kiểm tra
    triggerSuccessEffect();
</script>
</html>
