<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dọn dẹp sự kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="p-4">
    <div class="container bg-white p-4 shadow-sm rounded">
        <h4 class="mb-4 text-danger fw-bold">🛠 Quản lý & Dọn dẹp (SCRUM-17)</h4>
        <table class="table table-hover border">
            <thead class="table-dark">
                <tr><th>Sự kiện</th><th>Địa điểm</th><th>Thao tác</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function load() {
            fetch('/api/events').then(r => r.json()).then(data => {
                document.getElementById('list').innerHTML = data.map(ev => `
                    <tr>
                        <td>${ev.name}</td>
                        <td>${ev.location}</td>
                        <td>
                            <button class="btn btn-danger btn-sm fw-bold" onclick="confirmDelete('${ev.id}')">Xóa</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        // AC 1 & 2: Xác nhận và gọi API Xóa
        function confirmDelete(id) {
            Swal.fire({
                title: 'Xóa sự kiện này?',
                text: "Bạn sẽ không thể khôi phục lại dữ liệu!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Đúng, xóa nó!',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`/api/events/${id}`, { method: 'DELETE' })
                    .then(() => {
                        Swal.fire('Đã xóa!', 'Danh sách đã được làm gọn.', 'success');
                        load(); // Tải lại tự động (SCRUM-34)
                    });
                }
            });
        }
        load();
    </script>
</body>
</html>
