<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dọn dẹp sự kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="p-4 bg-light">
    <div class="container bg-white p-4 shadow-sm rounded">
        <h4 class="mb-4 text-danger fw-bold">🛠 Quản lý Sự Kiện (SCRUM-17)</h4>
        <table class="table table-hover border">
            <thead class="table-dark">
                <tr><th>Sự kiện</th><th>Địa điểm</th><th>Trạng thái</th><th>Thao tác</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script>
        function load() {
            fetch('/api/events').then(r => r.json()).then(data => {
                document.getElementById('list').innerHTML = data.map(ev => `
                    <tr class="${ev.isHidden ? 'table-secondary text-muted' : ''}">
                        <td class="fw-bold">${ev.name}</td>
                        <td>${ev.location}</td>
                        <td>${ev.isHidden ? '<span class="badge bg-secondary">Đã ẩn</span>' : '<span class="badge bg-success">Đang hiện</span>'}</td>
                        <td>
                            <button class="btn btn-${ev.isHidden ? 'success' : 'warning'} btn-sm fw-bold me-1" onclick="toggleHide('${ev.id}')">
                                ${ev.isHidden ? 'Hiện lại' : 'Ẩn'}
                            </button>
                            <button class="btn btn-danger btn-sm fw-bold" onclick="confirmDelete('${ev.id}')">Xóa</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        // Gọi API Ẩn/Hiện
        function toggleHide(id) {
            fetch(`/api/events/${id}/toggle-hide`, { method: 'PUT' })
            .then(() => load()); // Load lại bảng tự động
        }

        // Gọi API Xóa với xác nhận SweetAlert2
        function confirmDelete(id) {
            Swal.fire({
                title: 'Xóa sự kiện này?',
                text: "Dữ liệu sẽ mất vĩnh viễn!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Đúng, xóa đi!',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`/api/events/${id}`, { method: 'DELETE' })
                    .then(() => {
                        Swal.fire('Thành công!', 'Đã dọn dẹp danh sách.', 'success');
                        load(); 
                    });
                }
            });
        }
        load();
    </script>
</body>
</html>
