<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Chỉnh sửa sự kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="p-4 bg-light">
    <div class="container bg-white p-4 rounded shadow-sm">
        <h4 class="mb-4">🛠 Quản lý sự kiện (SCRUM-16)</h4>
        <table class="table table-hover border">
            <thead class="table-dark">
                <tr><th>Tên sự kiện</th><th>Địa điểm</th><th>Thao tác</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <h5 class="fw-bold">✏️ Sửa sự kiện</h5>
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="mb-2"><label>Tên</label><input type="text" id="editName" class="form-control" required></div>
                    <div class="mb-2"><label>Địa điểm</label><input type="text" id="editLocation" class="form-control" required></div>
                    <button type="submit" class="btn btn-success w-100 mt-3">Lưu thay đổi</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let events = [];
        const modal = new bootstrap.Modal(document.getElementById('editModal'));

        function load() {
            fetch('/api/events').then(r => r.json()).then(data => {
                events = data;
                document.getElementById('list').innerHTML = data.map(ev => `
                    <tr><td>${ev.name}</td><td>${ev.location}</td>
                    <td><button class="btn btn-warning btn-sm" onclick="openEdit('${ev.id}')">Sửa</button></td></tr>
                `).join('');
            });
        }

        // Logic đổ dữ liệu cũ vào Form
        function openEdit(id) {
            const ev = events.find(x => x.id === id);
            document.getElementById('editId').value = ev.id;
            document.getElementById('editName').value = ev.name;
            document.getElementById('editLocation').value = ev.location;
            modal.show();
        }

        // Gọi API PUT và thông báo SweetAlert2 (AC 2 & 3)
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const body = {
                name: document.getElementById('editName').value,
                location: document.getElementById('editLocation').value
            };

            fetch(`/api/events/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            }).then(() => {
                modal.hide();
                Swal.fire('Thành công!', 'Đã cập nhật dữ liệu.', 'success');
                load();
            });
        });
        load();
    </script>
</body>
</html>
